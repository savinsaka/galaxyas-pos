services:
  db:
    image: postgres:16-alpine
    container_name: galaxyas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: galaxyas
    ports:
      - "5432:5432"
    volumes:
      - galaxyas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d galaxyas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  galaxyas_pgdata:
