name: Release warehouse app

# Build GPOS Warehouse (folder warehouse/) di repo private ini, lalu publish
# installer-nya ke repo TERPISAH yang public (savinsaka/gpos-warehouse-releases).
# Terpisah dari workflow desktop: dipicu tag "wh-v*" (bukan "v*") supaya rilis
# POS dan Warehouse tidak saling memicu. Signing key sama dengan POS (pubkey
# di warehouse/src-tauri/tauri.conf.json identik), jadi secret yang dipakai
# juga sama.
on:
  push:
    tags:
      - "wh-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: warehouse
        run: npm ci

      # Patch note WAJIB: warehouse/patch-notes/<tag>.md (mis. wh-v1.1.1.md).
      # Isinya jadi teks rilis dan ikut ke latest.json ("notes"), lalu tampil di
      # popup "Update Tersedia" di aplikasi. Tidak ada file = rilis dibatalkan.
      - name: Read patch notes
        id: notes
        shell: pwsh
        run: |
          $f = "warehouse/patch-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $f)) { Write-Error "Patch note $f belum ada. Tulis dulu, commit, lalu buat ulang tag."; exit 1 }
          $body = (Get-Content $f -Raw -Encoding utf8).Trim()
          if (-not $body) { Write-Error "Patch note $f kosong."; exit 1 }
          $delim = "NOTES_" + [guid]::NewGuid().ToString("N")
          "body<<$delim`n$body`n$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          # Token dengan akses tulis ke repo publik gpos-warehouse-releases.
          # (RELEASE_REPO_TOKEN harus di-set akses-nya mencakup repo ini juga.)
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: warehouse
          owner: savinsaka
          repo: gpos-warehouse-releases
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: "GPOS Warehouse ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
