[package]
name = "galaxyas-mobilepos"
version = "0.1.0"
description = "GALAXYAS Mobile POS — kasir Android (client Server Pusat)"
authors = ["savinsaka"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "galaxyas_mobilepos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Client HTTP ke Server Pusat — LAN HTTP polos, sengaja TANPA backend TLS
# supaya cross-compile Android tidak butuh OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
