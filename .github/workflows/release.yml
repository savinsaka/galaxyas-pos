name: Release desktop app

# Build GALAXYAS POS (folder desktop/) di repo private ini, lalu publish
# installer-nya ke repo TERPISAH yang public (savinsaka/galaxyas-pos-releases)
# — repo ini sendiri tetap private, source code tidak ikut terekspos. Tauri
# updater di aplikasi membaca latest.json dari repo public itu untuk cek
# update otomatis.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # Patch note WAJIB: desktop/patch-notes/<tag>.md (mis. v1.8.2.md). Isinya
      # jadi teks rilis dan ikut ke latest.json ("notes"), lalu ditampilkan di
      # popup "Update Tersedia" di aplikasi. Tidak ada file = rilis dibatalkan.
      - name: Read patch notes
        id: notes
        shell: pwsh
        run: |
          $f = "desktop/patch-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $f)) { Write-Error "Patch note $f belum ada. Tulis dulu, commit, lalu buat ulang tag."; exit 1 }
          $body = (Get-Content $f -Raw -Encoding utf8).Trim()
          if (-not $body) { Write-Error "Patch note $f kosong."; exit 1 }
          $delim = "NOTES_" + [guid]::NewGuid().ToString("N")
          "body<<$delim`n$body`n$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          # Token dengan akses tulis ke repo publik galaxyas-pos-releases
          # (bukan GITHUB_TOKEN bawaan, karena itu hanya berlaku untuk repo
          # ini sendiri, tidak bisa dipakai membuat release di repo lain).
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          owner: savinsaka
          repo: galaxyas-pos-releases
          # Tag v* dibuat berdasarkan HEAD `main` di repo tujuan (galaxyas-pos-releases),
          # bukan SHA dari repo private ini — SHA itu tidak ada di repo tujuan sehingga
          # GitHub menolak (target_commitish invalid) kalau dibiarkan default.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: "GALAXYAS POS ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
